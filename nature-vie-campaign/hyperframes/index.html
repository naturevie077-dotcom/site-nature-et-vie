<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>NATURE &amp; VIE — Le bien-être en mouvement (HyperFrames)</title>
    <script src="assets/gsap.min.js"></script>
    <style>
      @font-face { font-family: "NV Bebas"; src: url("assets/fonts/bebas-neue-latin-400-normal.woff2") format("woff2"); font-weight: 400; }
      @font-face { font-family: "NV Mont"; src: url("assets/fonts/montserrat-latin-500-normal.woff2") format("woff2"); font-weight: 500; }
      @font-face { font-family: "NV Mont"; src: url("assets/fonts/montserrat-latin-600-normal.woff2") format("woff2"); font-weight: 600; }
      @font-face { font-family: "NV Mont"; src: url("assets/fonts/montserrat-latin-700-normal.woff2") format("woff2"); font-weight: 700; }
      @font-face { font-family: "NV Serif"; src: url("assets/fonts/cormorant-garamond-latin-600-italic.woff2") format("woff2"); font-weight: 600; font-style: italic; }

      :root {
        --emerald: #006b4f;
        --emerald-hi: #1fb98b;
        --emerald-deep: #00382a;
        --bordeaux: #801e32;
        --gold: #d4af37;
        --gold-hi: #ffe9a0;
        --white: #ffffff;
        --black: #0b1110;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--black); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--black); font-family: "NV Bebas", sans-serif; color: #fff; }
      .layer { position: absolute; inset: 0; }
      .scn { position: absolute; inset: 0; overflow: hidden; }
      .cam, .sub, .fill { position: absolute; inset: 0; }
      canvas { position: absolute; inset: 0; width: 1080px; height: 1920px; pointer-events: none; }

      /* ---------- typographie ---------- */
      .stack { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
      .mask { display: block; overflow: hidden; padding: 110px 30px 30px; margin: -110px -30px -30px; text-align: center; white-space: nowrap; }
      .ch { display: inline-block; }
      .line { display: block; text-align: center; white-space: nowrap; line-height: 0.86; }
      .gold-t { background: linear-gradient(100deg, #8f6f12 0%, #d4af37 24%, #fff3bd 48%, #d4af37 64%, #8f6f12 100%); background-size: 260% 100%; background-position: 100% 0; -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent; }
      .gold-t, .shine-t { padding-top: 0.3em; margin-top: -0.3em; }
      .shine-t { background: linear-gradient(100deg, #ffffff 0%, #ffffff 38%, #ffe9a0 50%, #ffffff 62%, #ffffff 100%); background-size: 320% 100%; background-position: 100% 0; -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent; }

      /* ---------- scène 1 ---------- */
      .s1-base { position: absolute; inset: 0; background: radial-gradient(ellipse 900px 1100px at 50% 55%, #0f2a22 0%, #0b1110 62%, #070c0b 100%); }
      .beam { position: absolute; top: -200px; width: 260px; height: 2300px; background: linear-gradient(180deg, rgba(31,185,139,0) 0%, rgba(31,185,139,.20) 45%, rgba(212,175,55,.09) 70%, rgba(31,185,139,0) 100%); filter: blur(34px); opacity: 0; }
      .le { font-size: 128px; letter-spacing: 0.42em; padding-left: 0.42em; color: #d4af37; font-family: "NV Mont", sans-serif; font-weight: 600; font-size: 74px; line-height: 1.2; }
      .big { font-size: 274px; }
      .sub-t { font-size: 138px; letter-spacing: 0.14em; padding-left: 0.14em; }
      .sub-t .ch { color: rgba(212,175,55,.08); -webkit-text-stroke: 3px #d4af37; }
      .sub-t .fillcopy { position: absolute; inset: 0; }
      .rule { height: 3px; width: 0; background: linear-gradient(90deg, rgba(212,175,55,0), #d4af37 30%, #fff3bd 50%, #d4af37 70%, rgba(212,175,55,0)); }

      /* ---------- scène 2 ---------- */
      .s2-base { position: absolute; inset: 0; background: radial-gradient(ellipse 1000px 1200px at 50% 48%, #0a8f6a 0%, #007a5a 30%, #006b4f 52%, #00382a 80%, #021410 100%); }
      .blob { position: absolute; border-radius: 50%; filter: blur(60px); }
      .lf { position: absolute; overflow: visible; will-change: transform; }
      .shaft { position: absolute; top: -400px; width: 360px; height: 2800px; background: linear-gradient(180deg, rgba(255,240,190,0) 0%, rgba(255,240,190,.34) 50%, rgba(255,240,190,0) 100%); mix-blend-mode: screen; filter: blur(26px); }
      .s2-w { font-size: 300px; }
      .s2-la { font-size: 168px; }
      .s2-stack { gap: 6px; }
      
      .outline-t .ch { color: rgba(255,255,255,.07); -webkit-text-stroke: 4px #ffffff; position: relative; }
      .outline-t .ch::after { content: attr(data-c); position: absolute; left: 0; top: 0; color: #fff; -webkit-text-stroke: 0; opacity: var(--f, 0); }

      /* ---------- scène 3 ---------- */
      .n-base { position: absolute; inset: 0; background: radial-gradient(ellipse 1000px 1250px at 50% 50%, #0aa57b 0%, #006b4f 36%, #00291f 72%, #0b1110 100%); }
      .e-base { position: absolute; inset: 0; background: radial-gradient(ellipse 1000px 1250px at 50% 50%, #b3314f 0%, #801e32 38%, #3b0b17 74%, #0b1110 100%); }
      .q-base { position: absolute; inset: 0; background: linear-gradient(112deg, #00503b 0%, #006b4f 36%, #0b1110 50%, #801e32 64%, #5a1424 100%); }
      .rays { position: absolute; left: -700px; top: -340px; width: 2480px; height: 2480px; border-radius: 50%; background: repeating-conic-gradient(from 0deg, rgba(255,255,255,.085) 0deg 3.4deg, rgba(255,255,255,0) 3.4deg 11deg); -webkit-mask-image: radial-gradient(circle, #000 12%, transparent 62%); mask-image: radial-gradient(circle, #000 12%, transparent 62%); }
      .ringx { position: absolute; left: 50%; top: 50%; border-radius: 50%; border: 3px solid rgba(255, 226, 140, .65); margin-left: -300px; margin-top: -300px; width: 600px; height: 600px; }
      .w3 { white-space: nowrap; line-height: 0.84; text-align: center; }
      .w3-n { font-size: 358px; }
      .w3-e { font-size: 330px; }
      .w3-q { font-size: 270px; }
      .idx { position: absolute; left: 90px; top: 150px; font-family: "NV Mont", sans-serif; font-weight: 600; font-size: 30px; letter-spacing: .32em; color: #ffe9a0; display: flex; align-items: center; gap: 24px; }
      .idx i { display: block; width: 0; height: 2px; background: #d4af37; }
      .slice { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
      .speed { position: absolute; height: 3px; left: 0; background: linear-gradient(90deg, rgba(255,233,160,0), rgba(255,233,160,.9) 60%, #fff); border-radius: 2px; }
      .bolt { position: absolute; inset: 0; overflow: visible; }

      /* ---------- scène 4 ---------- */
      .s4-base { position: absolute; inset: 0; background: radial-gradient(ellipse 950px 1250px at 50% 50%, #0b8a69 0%, #006b4f 34%, #003b2d 66%, #04120e 100%); }
      .s4-shaft { position: absolute; top: -300px; width: 300px; height: 2600px; background: linear-gradient(180deg, rgba(255,226,140,0), rgba(255,226,140,.20) 50%, rgba(255,226,140,0)); filter: blur(30px); mix-blend-mode: screen; }
      .frame-svg { position: absolute; inset: 0; filter: drop-shadow(0 0 8px rgba(255,214,120,.85)) drop-shadow(0 0 22px rgba(212,175,55,.5)); }
      .frame-fill { position: absolute; left: 90px; top: 550px; width: 900px; height: 820px; border-radius: 36px; background: radial-gradient(ellipse at 50% 50%, rgba(0,56,42,.75), rgba(4,18,14,.88)); opacity: 0; }
      .s4-n { font-size: 300px; }
      .s4-amp { font-family: "NV Serif", serif; font-style: italic; font-weight: 600; color: #f4d77e; font-size: 280px; display: inline-block; margin-right: 18px; line-height: 0.86; }
      .s4-v { font-size: 300px; }
      .s4-tick { position: absolute; width: 16px; height: 16px; background: #ffe9a0; transform: rotate(45deg); opacity: 0; box-shadow: 0 0 18px rgba(255,226,140,.9); }

      /* ---------- scène 5 ---------- */
      .s5-base { position: absolute; inset: 0; background: radial-gradient(ellipse 900px 1100px at 50% 42%, #0a2a21 0%, #0b1110 60%, #060a09 100%); }
      .s5-rays { position: absolute; left: -500px; top: -100px; width: 2080px; height: 2080px; border-radius: 50%; background: repeating-conic-gradient(from 0deg, rgba(212,175,55,.10) 0deg 5deg, rgba(212,175,55,0) 5deg 15deg); -webkit-mask-image: radial-gradient(circle, #000 5%, transparent 55%); mask-image: radial-gradient(circle, #000 5%, transparent 55%); opacity: 0; }
      .glow5 { position: absolute; left: 190px; top: 450px; width: 700px; height: 700px; border-radius: 50%; background: radial-gradient(circle, rgba(255,226,140,.75) 0%, rgba(212,175,55,.35) 32%, rgba(212,175,55,0) 68%); opacity: 0; }
      .logo-wrap { position: absolute; left: 270px; top: 530px; width: 540px; height: 540px; }
      .logo-wrap img { width: 100%; height: 100%; display: block; border-radius: 50%; box-shadow: 0 30px 90px rgba(0,0,0,.6), 0 0 70px rgba(212,175,55,.35); }
      .ring5 { position: absolute; left: 210px; top: 470px; width: 660px; height: 660px; filter: drop-shadow(0 0 10px rgba(255,214,120,.8)); }
      .tag { font-family: "NV Mont", sans-serif; font-weight: 600; font-size: 60px; letter-spacing: .2em; padding-left: .2em; line-height: 1.25; }
      .tag-wrap { position: absolute; left: 0; right: 0; top: 1190px; display: flex; flex-direction: column; align-items: center; gap: 10px; }

      #fadeout { position: absolute; inset: 0; background: #000; opacity: 0; z-index: 9; }
    </style>
  </head>
  <body>
    <!-- symboles SVG partagés : feuille stylisée en deux demi-limbes (ombre / lumière) -->
    <svg width="0" height="0" style="position:absolute">
      <defs>
        <linearGradient id="gLeafL" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00281e" /><stop offset="1" stop-color="#00805f" /></linearGradient>
        <linearGradient id="gLeafR" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00a47b" /><stop offset="1" stop-color="#4be3b0" /></linearGradient>
        <symbol id="leaf" viewBox="-100 -110 200 220">

          <path d="M0,-100 C-58,-62 -64,28 0,100 Z" fill="url(#gLeafL)" />
          <path d="M0,-96 L0,96 M0,-62 Q20,-66 38,-80 M0,-28 Q26,-36 50,-56 M0,8 Q28,-2 54,-24 M0,44 Q24,34 44,14 M0,74 Q14,66 26,54 M0,-62 Q-20,-66 -38,-80 M0,-28 Q-26,-36 -50,-56 M0,8 Q-28,-2 -54,-24 M0,44 Q-24,34 -44,14 M0,74 Q-14,66 -26,54" fill="none" stroke="rgba(255,226,140,.5)" stroke-width="1.5" stroke-linecap="round" />
          <path d="M0,-100 C58,-62 64,28 0,100 C-64,28 -58,-62 0,-100Z" fill="none" stroke="rgba(255,226,140,.45)" stroke-width="1.6" />

        <linearGradient id="gGold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8f6f12" /><stop offset=".45" stop-color="#ffe9a0" /><stop offset=".75" stop-color="#d4af37" /><stop offset="1" stop-color="#ffe9a0" /></linearGradient>
        <linearGradient id="gRib" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4be3b0" stop-opacity=".0" /><stop offset=".3" stop-color="#4be3b0" /><stop offset=".7" stop-color="#ffe9a0" /><stop offset="1" stop-color="#d4af37" stop-opacity=".1" /></linearGradient>
      </defs>
    </svg>

    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="24"
      data-width="1080"
      data-height="1920"
      data-fps="30"
    >
      <audio id="bgm" src="assets/audio/soundtrack-master.wav" data-start="0" data-duration="24" data-track-index="0" data-volume="1"></audio>

            <div class="blob" id="blobB" style="left:520px;top:1100px;width:820px;height:820px;background:radial-gradient(circle,rgba(212,175,55,.38),rgba(212,175,55,0) 70%)"></div>
            <div class="blob" id="blobC" style="left:300px;top:-200px;width:700px;height:700px;background:radial-gradient(circle,rgba(255,255,255,.26),rgba(255,255,255,0) 70%)"></div>
            <div class="fill" id="s2-far"></div>
            <svg class="fill" id="s2-rib" viewBox="0 0 1080 1920" width="1080" height="1920" style="filter: drop-shadow(0 0 10px rgba(255,226,140,.5))"></svg>
            <div class="fill" id="s2-mid" style="filter: drop-shadow(0 34px 38px rgba(0,20,14,.5))"></div>

            <div class="shaft" id="shaftB" style="left:640px;transform:rotate(18deg);opacity:.7"></div>

        </section>

        <!-- S3 : trois décors successifs -->
        <section id="s3-bg" class="clip scn" data-start="8.9" data-duration="6.5" data-track-index="1">

            </svg>
            <div class="logo-wrap" id="logo-wrap"><img id="logo" src="assets/img/logo-nature-et-vie.png" alt="Nature et Vie" /></div>
            <div class="stack" style="top: 1130px; bottom: auto; height: 0"><div class="rule" id="s5-rule" style="margin-top:0"></div></div>
            <div class="tag-wrap">
              <div class="mask"><span id="tg1" class="tag" style="display:block">VIVRE MIEUX,</span></div>
              <div class="mask"><span id="tg2" class="tag" style="display:block;color:#fff">NATURELLEMENT.</span></div>
            </div>
          </div>
        </section>
      </div>

      <canvas data-layout-ignore data-layout-allow-occlusion id="cv-front" width="1080" height="1920" style="z-index: 4"></canvas>
      <div id="fadeout"></div>
    </div>

    <script src="assets/fx.js"></script>
    <script>
      (function () {
        const NV = window.NV, E = NV.ease, W = 1080, H = 1920, CX = 540, CY = 960;
        const $ = (s, r) => (r || document).querySelector(s);
        const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
        const tl = gsap.timeline({ paused: true });

        /* ------------------------------------------------------------------ outils */
        function split(el, cls) {
          const txt = el.textContent; el.textContent = "";
          return Array.from(txt).map((c) => {
            const s = document.createElement("span");
            s.className = "ch" + (cls ? " " + cls : ""); s.dataset.c = c;
            s.textContent = c === " " ? " " : c; el.appendChild(s); return s;
          });
        }
        function leaf(parent, o) {
          const w = o.s, h = o.s * 1.1;
          parent.insertAdjacentHTML("beforeend",
            `<svg class="lf" viewBox="-100 -110 200 220" style="left:${o.x - w / 2}px;top:${o.y - h / 2}px;width:${w}px;height:${h}px"><use href="#leaf" x="-100" y="-110" width="200" height="220"/></svg>`);
          return parent.lastElementChild;
        }
        function scatter(parent, o) {
          const r = NV.rng(o.seed), out = [];
          let guard = 0;
          while (out.length < o.n && guard++ < 4000) {
            const x = r() * (W + 240) - 120, y = r() * (H + 240) - 120;
            if (o.avoid && x > 170 && x < 910 && y > 520 && y < 1400) continue;
            if (o.edge && !(x < 150 || x > 930)) continue;
            const s = o.size[0] + r() * (o.size[1] - o.size[0]);
            const rot = r() * 360, op = o.op[0] + r() * (o.op[1] - o.op[0]);
            const el = leaf(parent, { x, y, s });
            el.style.opacity = 0;
            out.push({ el, x, y, s, rot, op, ph: r() });
          }
          return out;
        }
        function poly(el, p) { $$(el).forEach((n) => (n.style.clipPath = p)); }
        const HIDE = "polygon(0px 0px,0px 0px,0px 0px)";
        function zig(edge) {
          const pts = [];
          for (let i = 0, y = 0; y <= H + 120; i++, y += 120) pts.push([edge + (i % 2 ? 80 : -80), y]);
          const p = pts.map(([x, y]) => `${x.toFixed(1)}px ${y}px`).join(",");
          return `polygon(${p},${W + 200}px ${H + 120}px,${W + 200}px 0px)`;
        }
        function diamond(R) { return `polygon(${CX}px ${CY - R}px,${CX + R}px ${CY}px,${CX}px ${CY + R}px,${CX - R}px ${CY}px)`; }
        function shake(targets, at, amp) {
          const seq = [[1, -1], [-0.8, 0.9], [0.6, -0.7], [-0.4, 0.4], [0.2, -0.2], [0, 0]];
          seq.forEach((s, i) => tl.to(targets, { x: s[0] * amp, y: s[1] * amp, duration: 0.045, ease: "none" }, at + i * 0.045));
        }

        /* ------------------------------------------------------------------ canvas (FX partagé) */
        const cB = $("#cv-back").getContext("2d"), cF = $("#cv-front").getContext("2d");
        const P = { t: 0 };
        tl.to(P, { t: 24, duration: 24, ease: "none", onUpdate: () => { NV.drawBack(cB, P.t); cF.clearRect(0, 0, W, H); NV.drawFront(cF, P.t); } }, 0);

        /* ================================================================== SCÈNE 1 — L'OUVERTURE (0 → 4) */
        const le = $("#t-le"), bien = $("#t-bien"), mouv = $("#t-mouv");
        const mouvCh = split(mouv);
        gsap.set(le, { yPercent: 130, opacity: 0 });
        gsap.set(bien, { yPercent: 118, scaleY: 1.18, transformOrigin: "50% 100%", opacity: 0 });
        gsap.set(mouvCh, { opacity: 0 });

        // caméra virtuelle : poussée lente + dérive
        tl.fromTo(".cam1", { scale: 1.0, rotation: -1.3 }, { scale: 1.17, rotation: 0.8, duration: 4.0, ease: "power1.inOut" }, 0);
        // faisceaux de lumière verte (profondeur)
        ["#beam1", "#beam2", "#beam3"].forEach((b, i) => {
          tl.fromTo(b, { opacity: 0, y: 260 }, { opacity: 1, y: -120, duration: 2.4, ease: "sine.inOut" }, 1.0 + i * 0.16);
          tl.to(b, { opacity: 0, duration: 0.9, ease: "power1.in" }, 3.2 + i * 0.1);
        });
        // « LE » + BIEN-ÊTRE : révélation par masque sur l'impact (1.7 s)
        tl.fromTo(le, { yPercent: 130, opacity: 0, scale: 1.25 }, { yPercent: 0, opacity: 1, scale: 1, duration: 1.0, ease: "expo.out" }, 1.78);
        tl.fromTo(bien, { yPercent: 118, scaleY: 1.18, opacity: 0 }, { yPercent: 0, scaleY: 1, opacity: 1, duration: 0.95, ease: "expo.out" }, 1.7);
        tl.fromTo(bien, { backgroundPosition: "100% 0" }, { backgroundPosition: "0% 0", duration: 1.15, ease: "power2.inOut" }, 2.15);
        shake(".cam1", 1.7, 14);
        // règle dorée
        tl.fromTo("#s1-rule", { width: 0, opacity: 1 }, { width: 760, duration: 0.9, ease: "expo.out" }, 2.55);
        // « EN MOUVEMENT » : tracking cinématique sur l'impact 2.8 s, contour → remplissage doré
        tl.fromTo(mouvCh, { opacity: 0, y: 70, filter: "blur(18px)", scale: 1.5 }, { opacity: 1, y: 0, filter: "blur(0px)", scale: 1, duration: 0.8, ease: "expo.out", stagger: 0.035 }, 2.8);
        tl.to(mouvCh, { color: "#d4af37", webkitTextStrokeColor: "#ffe9a0", duration: 0.5, ease: "power2.out", stagger: 0.02 }, 3.2);
        shake(".cam1", 2.8, 10);
        // sortie : aspiration vers le centre avant le morphing
        tl.to(["#s1-fg .stack"], { scale: 1.5, opacity: 0, filter: "blur(18px)", duration: 0.42, ease: "power3.in" }, 3.55);
        tl.to("#s1-bg .cam", { scale: 1.6, duration: 0.55, ease: "power3.in" }, 3.55);

        /* ================================================================== SCÈNE 2 — L'UNIVERS (4 → 9) */
        const s2 = { far: $("#s2-far"), mid: $("#s2-mid"), near: $("#s2-near"), rib: $("#s2-rib") };
        const farL = scatter(s2.far, { n: 16, seed: 21, size: [120, 230], op: [0.28, 0.5], avoid: true });
        const midL = scatter(s2.mid, { n: 15, seed: 22, size: [190, 360], op: [0.8, 1], avoid: true });
        const nearL = scatter(s2.near, { n: 7, seed: 23, size: [470, 700], op: [0.95, 1], edge: true });
        gsap.set(s2.far, { filter: "blur(5px)" });
        gsap.set(s2.near, { filter: "blur(11px) drop-shadow(0 50px 50px rgba(0,16,11,.55))" });
        const midRim = (parent) => parent; // (rim-light déjà dans le symbole)

        // morphing géométrique : S2 est révélé à travers un polygone « pétales » (bord doré dessiné par fx.js)
        const MP = { p: 0 };
        poly("#s2-bg, #s2-fg", HIDE);
        tl.to(MP, { p: 1, duration: 0.95, ease: "none", onUpdate: () => poly("#s2-bg, #s2-fg", MP.p <= 0 ? HIDE : NV.morphPolygon(MP.p)) }, 4.0);
        tl.set("#s2-bg, #s2-fg", { clipPath: "none" }, 4.98);

        // rubans végétaux (tracés SVG) qui se dessinent
        const ribs = [
          "M-60,1750 C240,1500 120,1250 420,1060 S860,900 1000,620 S900,240 1140,60",
          "M1140,1650 C860,1480 960,1180 700,1020 S260,880 160,560 S300,200 -60,20",
          "M-80,980 C200,900 330,1180 560,1000 S800,720 1160,860",
          "M1120,1180 C880,1260 760,1020 540,1180 S260,1500 -40,1380",
        ];
        s2.rib.innerHTML = '<g fill="none" stroke-linecap="butt">' + ribs.map((d, i) => `<path class="rb" d="${d}" pathLength="1000" stroke="url(#gRib)" stroke-width="${[9, 7, 5, 6][i]}" stroke-dasharray="1000" stroke-dashoffset="1000" opacity="${[0.9, 0.8, 0.7, 0.75][i]}"/>`).join("") + "</g>";
        $$(".rb", s2.rib).forEach((p, i) => tl.fromTo(p, { strokeDashoffset: 1000 }, { strokeDashoffset: 0, duration: 2.2, ease: "power2.inOut" }, 4.35 + i * 0.22));

        // feuilles : émergent du centre en pétales, puis oscillent (parallaxe multicouche)
        function emerge(list, t0, spread, sway) {
          list.forEach((o, i) => {
            const d = Math.hypot(o.x - CX, o.y - CY) / 1500;
            const at = t0 + d * spread;
            tl.fromTo(o.el, { x: CX - o.x, y: CY - o.y, scale: 0.05, rotation: o.rot + 150, opacity: 0 }, { x: 0, y: 0, scale: 1, rotation: o.rot, opacity: o.op, duration: 1.25, ease: "back.out(1.15)" }, at);
            tl.to(o.el, { rotation: o.rot + sway * (o.ph > 0.5 ? 1 : -1), y: sway * 2.2, duration: 9.2 - at - 1.25, ease: "sine.inOut" }, at + 1.25);
          });
        }
        emerge(farL, 4.25, 0.7, 10);
        emerge(midL, 4.3, 0.8, 16);
        emerge(nearL, 4.4, 0.55, 8);
        // caméra 2.5D : couches à vitesses différentes + rotation 3D
        tl.fromTo(s2.far, { x: 0, y: 0, scale: 1.0 }, { x: -25, y: -50, scale: 1.04, duration: 5.2, ease: "none" }, 4.0);
        tl.fromTo(s2.mid, { x: 0, y: 0, scale: 1.0 }, { x: -85, y: -140, scale: 1.08, duration: 5.2, ease: "none" }, 4.0);
        tl.fromTo(s2.near, { x: 0, y: 0, scale: 1.0 }, { x: -210, y: -300, scale: 1.18, duration: 5.2, ease: "none" }, 4.0);
        tl.fromTo("#s2cam-bg, #s2cam-fg", { rotationY: -5, scale: 1.0 }, { rotationY: 5, scale: 1.05, duration: 4.6, ease: "sine.inOut" }, 4.0);
        // lueurs organiques + réfraction lumineuse
        tl.fromTo("#blobA", { x: 0, y: 0 }, { x: 260, y: 160, duration: 5.2, ease: "sine.inOut" }, 4.0);
        tl.fromTo("#blobB", { x: 0, y: 0 }, { x: -240, y: -200, duration: 5.2, ease: "sine.inOut" }, 4.0);
        tl.fromTo("#blobC", { x: 0, y: 0 }, { x: -120, y: 260, duration: 5.2, ease: "sine.inOut" }, 4.0);
        tl.fromTo("#shaftA", { x: -500, opacity: 0 }, { x: 900, opacity: 0.85, duration: 4.8, ease: "sine.inOut" }, 4.2);
        tl.fromTo("#shaftB", { x: -900, opacity: 0 }, { x: 600, opacity: 0.6, duration: 4.8, ease: "sine.inOut" }, 4.5);

        // « LA NATURE NOUS INSPIRE » — une chorégraphie par mot
        const la = $("#w-la"), nat = $("#w-nat"), nous = $("#w-nous"), ins = $("#w-ins");
        const natCh = split(nat), nousCh = split(nous), insCh = split(ins);
        gsap.set([la, nat, nous, ins], { opacity: 0 });
        // LA : glisse de la gauche, incliné → droit, masque latéral
        tl.fromTo(la, { x: -700, skewX: 28, rotation: -9, opacity: 0, clipPath: "inset(0 100% 0 0)" }, { x: 0, skewX: 0, rotation: 0, opacity: 1, clipPath: "inset(0 0% 0 0)", duration: 0.85, ease: "expo.out" }, 5.0);
        tl.fromTo(la, { backgroundPosition: "100% 0" }, { backgroundPosition: "0% 0", duration: 1.4, ease: "power2.inOut" }, 5.2);
        // NATURE : lettres qui se redressent en 3D depuis le bas, flou → net
        tl.set(nat, { opacity: 1 }, 5.45);
        tl.fromTo(natCh, { y: 330, rotationX: -85, transformPerspective: 1100, opacity: 0, filter: "blur(16px)" }, { y: 0, rotationX: 0, opacity: 1, filter: "blur(0px)", duration: 0.9, ease: "back.out(1.5)", stagger: 0.055 }, 5.5);
        // NOUS : zoom caméra depuis l'avant (échelle géante), contour puis remplissage
        tl.set(nous, { opacity: 1 }, 6.25);
        tl.fromTo(nousCh, { scale: 3.4, opacity: 0, filter: "blur(30px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.85, ease: "expo.out", stagger: 0.05 }, 6.3);
        tl.to(nousCh, { "--f": 1, duration: 0.45, ease: "power2.out", stagger: 0.06 }, 6.9);
        // INSPIRE : lettres dispersées qui convergent, sweep doré
        tl.set(ins, { opacity: 1 }, 6.95);
        insCh.forEach((c, i) => c.classList.add("gold-t"));
        tl.fromTo(insCh, { x: (i) => (i - 3) * 190, scale: 1.7, opacity: 0, rotation: (i) => (i - 3) * 14 }, { x: 0, scale: 1, opacity: 1, rotation: 0, duration: 1.0, ease: "power4.out", stagger: { each: 0.04, from: "center" } }, 7.0);
        tl.fromTo(insCh, { backgroundPosition: "100% 0" }, { backgroundPosition: "0% 0", duration: 1.2, ease: "power2.inOut", stagger: 0.07 }, 7.6);
        // sortie : fouet vers le haut puis zoom traversant sur l'impact 9.0
        tl.to([la, nat, nous, ins], { y: -160, opacity: 0, filter: "blur(14px)", duration: 0.35, ease: "power2.in", stagger: 0.04 }, 8.45);
        tl.to("#s2cam-bg, #s2cam-fg", { scale: 2.6, duration: 0.42, ease: "power3.in" }, 8.62);
        tl.to("#s2-bg, #s2-fg", { opacity: 0, duration: 0.12, ease: "none" }, 9.0);

        /* ================================================================== SCÈNE 3 — LA PUISSANCE DU MOTION (9 → 15) */
        poly("#e-bg, #e-fg, #q-bg, #q-fg", HIDE);
        // ---- N : NATURE (9 → 11)
        const nWord = $("#n-word"), nCh = split(nWord);
        tl.fromTo("#n-bg, #n-fg", { scale: 0.62, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: "expo.out" }, 8.98);
        tl.fromTo("#n-cam-bg, #n-cam-fg", { scale: 1.02, rotation: -2 }, { scale: 1.16, rotation: 2, duration: 2.25, ease: "power1.inOut" }, 9.0);
        tl.fromTo("#n-rays", { rotation: -10 }, { rotation: 28, duration: 2.4, ease: "none" }, 9.0);
        // anneaux dorés concentriques (balises de rythme)
        const nr = $("#n-rings");
        for (let i = 0; i < 5; i++) nr.insertAdjacentHTML("beforeend", '<div class="ringx"></div>');
        $$(".ringx", nr).forEach((r, i) => tl.fromTo(r, { scale: 0.15, opacity: 0.9 }, { scale: 2.8 - i * 0.1, opacity: 0, duration: 1.5, ease: "power2.out" }, 9.0 + i * 0.22));
        // feuilles-silhouettes géantes en rotation 3D
        const nl = $("#n-leaves");
        const nLeaves = [{ x: 90, y: 330, s: 760, r: -25 }, { x: 1010, y: 1560, s: 840, r: 150 }, { x: 960, y: 260, s: 520, r: 60 }, { x: 80, y: 1650, s: 600, r: 215 }].map((o) => {
          const el = leaf(nl, o); el.style.opacity = 0.34; el.style.filter = "brightness(.55) saturate(1.1)"; return Object.assign(o, { el });
        });
        nLeaves.forEach((o, i) => tl.fromTo(o.el, { rotation: o.r - 40, scale: 0.4 }, { rotation: o.r + 50, scale: 1, duration: 2.3, ease: "power2.out", transformPerspective: 900, rotationY: 0 }, 9.0 + i * 0.05));
        // lettres : bascule 3D + masque
        tl.fromTo(nCh, { rotationX: -100, y: 220, transformPerspective: 1200, opacity: 0, filter: "blur(14px)" }, { rotationX: 0, y: 0, opacity: 1, filter: "blur(0px)", duration: 0.75, ease: "back.out(1.35)", stagger: 0.045 }, 9.02);
        nCh.forEach((c) => c.classList.add("shine-t"));
        tl.fromTo(nCh, { backgroundPosition: "100% 0" }, { backgroundPosition: "0% 0", duration: 0.9, ease: "power2.inOut", stagger: 0.06 }, 9.6);
        tl.fromTo("#n-idx i", { width: 0 }, { width: 140, duration: 0.7, ease: "expo.out" }, 9.15);
        tl.fromTo("#n-rule", { width: 0 }, { width: 760, duration: 0.8, ease: "expo.out" }, 9.5);
        shake("#n-cam-fg, #n-cam-bg", 9.0, 18);
        tl.to("#n-fg", { opacity: 0, duration: 0.2, ease: "none" }, 11.1);
        tl.to(nCh, { y: -240, opacity: 0, filter: "blur(12px)", duration: 0.32, ease: "power3.in", stagger: 0.025 }, 10.72);

        // ---- E : ÉNERGIE (11 → 13) — balayage en dents de scie
        const eSl = $("#e-slices");
        for (let i = 0; i < 5; i++) eSl.insertAdjacentHTML("beforeend", `<div class="slice" style="clip-path:inset(${i * 20}% 0 ${80 - i * 20}% 0)"><div class="w3 w3-e shine-t" style="font-size:330px">ÉNERGIE</div></div>`);
        const slices = $$(".slice", eSl);
        const ghost = (() => { eSl.insertAdjacentHTML("beforeend", '<div class="slice" style="mix-blend-mode:screen"><div class="w3 w3-e" style="font-size:330px;color:#ffd27a;opacity:.85">ÉNERGIE</div></div>'); return eSl.lastElementChild; })();
        const WP = { p: 0 };
        tl.to(WP, { p: 1, duration: 0.5, ease: "power3.inOut", onUpdate: () => poly("#e-bg, #e-fg", WP.p <= 0 ? HIDE : WP.p >= 1 ? "none" : zig(lerp(W + 240, -260, WP.p))) }, 10.85);
        function lerp(a, b, t) { return a + (b - a) * t; }
        tl.fromTo("#e-cam-bg, #e-cam-fg", { scale: 1.3, rotation: 7 }, { scale: 1.0, rotation: -2, duration: 2.1, ease: "expo.out" }, 11.0);
        tl.fromTo("#e-rays", { rotation: 0 }, { rotation: -40, duration: 2.2, ease: "none" }, 11.0);
        slices.forEach((s, i) => {
          const dir = i % 2 ? 1 : -1;
          tl.fromTo(s, { x: dir * 1300, skewX: dir * -38, opacity: 0 }, { x: 0, skewX: 0, opacity: 1, duration: 0.7, ease: "expo.out" }, 11.02 + i * 0.045);
          tl.to(s, { x: dir * 6, duration: 0.06, ease: "none", yoyo: true, repeat: 1 }, 11.9);
        });
        tl.fromTo(ghost, { x: 80, opacity: 0 }, { x: 0, opacity: 0.85, duration: 0.5, ease: "expo.out" }, 11.1);
        tl.to(ghost, { opacity: 0, duration: 0.5, ease: "power2.out" }, 11.65);
        tl.fromTo("#e-idx-line", { width: 0 }, { width: 140, duration: 0.7, ease: "expo.out" }, 11.15);
        // lignes de vitesse
        const es = $("#e-speed"), er = NV.rng(5);
        for (let i = 0; i < 16; i++) { const w = 380 + er() * 560; es.insertAdjacentHTML("beforeend", `<div class="speed" style="top:${80 + er() * 1760}px;width:${w}px"></div>`); }
        $$(".speed", es).forEach((s, i) => tl.fromTo(s, { x: -700, opacity: 1 }, { x: W + 300, opacity: 0.2, duration: 0.55 + (i % 4) * 0.08, ease: "power2.in" }, 11.0 + (i % 8) * 0.12));
        // éclairs
        const bolts = $("#e-bolts"), br = NV.rng(88);
        const mkBolt = (x0, y0, ang, len) => { let d = `M${x0},${y0}`, x = x0, y = y0; const n = 11; for (let i = 0; i < n; i++) { const a = ang + (br() - 0.5) * 0.9; x += Math.cos(a) * (len / n); y += Math.sin(a) * (len / n); d += ` L${x.toFixed(0)},${y.toFixed(0)}`; } return d; };
        [[CX, CY, -1.9, 780], [CX, CY, 0.9, 760], [CX, CY, 2.7, 700]].forEach((b, i) => bolts.insertAdjacentHTML("beforeend", `<path class="bl" d="${mkBolt(...b)}" pathLength="1000" fill="none" stroke="#fff3bd" stroke-width="${5 - i}" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="1000" stroke-dashoffset="1000"/>`));
        $$(".bl", bolts).forEach((p, i) => {
          tl.fromTo(p, { strokeDashoffset: 1000, opacity: 1 }, { strokeDashoffset: 0, duration: 0.2, ease: "power2.out" }, 11.05 + i * 0.05);
          [11.55, 11.95, 12.45].forEach((t) => tl.fromTo(p, { opacity: 1 }, { opacity: 0.1, duration: 0.05, ease: "none", yoyo: true, repeat: 3, immediateRender: false }, t + i * 0.03));
          tl.to(p, { opacity: 0, duration: 0.2 }, 12.7);
        });
        const er2 = $("#e-rings");
        for (let i = 0; i < 4; i++) er2.insertAdjacentHTML("beforeend", '<div class="ringx" style="border-color:rgba(255,200,150,.7)"></div>');
        $$(".ringx", er2).forEach((r, i) => tl.fromTo(r, { scale: 0.2, opacity: 0.9 }, { scale: 2.6, opacity: 0, duration: 1.2, ease: "power2.out" }, 11.0 + i * 0.5));
        shake("#e-cam-fg, #e-cam-bg", 11.0, 22);
        tl.to("#e-fg", { opacity: 0, duration: 0.2, ease: "none" }, 13.05);
        tl.to(slices, { x: (i) => (i % 2 ? 1 : -1) * 1300, skewX: (i) => (i % 2 ? -1 : 1) * 36, duration: 0.3, ease: "power3.in", stagger: 0.03 }, 12.68);

        // ---- Q : ÉQUILIBRE (13 → 15) — iris en losange
        const qWord = $("#q-word"), qCh = split(qWord);
        const DP = { r: 0 };
        tl.to(DP, { r: 1, duration: 0.55, ease: "power3.inOut", onUpdate: () => poly("#q-bg, #q-fg", DP.r <= 0 ? HIDE : DP.r >= 1 ? "none" : diamond(lerp(30, 2000, DP.r))) }, 12.85);
        tl.fromTo("#q-cam-bg, #q-cam-fg", { scale: 1.25, rotation: -6 }, { scale: 1.0, rotation: 2, duration: 1.55, ease: "expo.out" }, 13.0);
        // disque en deux moitiés (vert / bordeaux) qui s'emboîtent
        tl.fromTo("#q-half-l", { x: -700, rotation: -50, transformOrigin: "540px 960px" }, { x: 0, rotation: 0, duration: 1.0, ease: "expo.out" }, 13.0);
        tl.fromTo("#q-half-r", { x: 700, rotation: 50, transformOrigin: "540px 960px" }, { x: 0, rotation: 0, duration: 1.0, ease: "expo.out" }, 13.0);
        tl.fromTo("#q-ring", { strokeDashoffset: 1000 }, { strokeDashoffset: 0, duration: 1.1, ease: "power3.out" }, 13.2);
        tl.fromTo("#q-orb", { rotation: -180, transformOrigin: "540px 960px" }, { rotation: 540, duration: 2.1, ease: "power1.inOut" }, 13.0);
        tl.fromTo("#q-horizon", { opacity: 0, scaleX: 0, transformOrigin: "540px 960px" }, { opacity: 0.8, scaleX: 1, duration: 0.7, ease: "expo.out" }, 13.15);
        tl.fromTo("#q-horizon", { rotation: -7, transformOrigin: "540px 960px" }, { rotation: 0, duration: 1.2, ease: "elastic.out(1,0.35)", immediateRender: false }, 13.2);
        // lettres : arrivent des deux côtés (symétrie), rotation Y
        tl.fromTo(qCh, { x: (i) => (i % 2 ? 1 : -1) * 620, rotationY: (i) => (i % 2 ? 1 : -1) * 80, opacity: 0, filter: "blur(18px)", transformPerspective: 1300 }, { x: 0, rotationY: 0, opacity: 1, filter: "blur(0px)", duration: 0.85, ease: "expo.out", stagger: { each: 0.04, from: "edges" } }, 13.02);
        qCh.forEach((c) => c.classList.add("shine-t"));
        tl.fromTo(qCh, { backgroundPosition: "100% 0" }, { backgroundPosition: "0% 0", duration: 0.9, ease: "power2.inOut", stagger: 0.05 }, 13.7);
        tl.fromTo("#q-idx-line", { width: 0 }, { width: 140, duration: 0.7, ease: "expo.out" }, 13.15);
        shake("#q-cam-fg, #q-cam-bg", 13.0, 16);
        // vortex de sortie vers S4
        tl.to("#q-cam-bg, #q-cam-fg", { scale: 3.4, rotation: 36, duration: 0.5, ease: "power3.in" }, 14.58);
        tl.to("#s3-bg, #s3-fg", { opacity: 0, duration: 0.25, ease: "power1.in" }, 14.85);

        /* ================================================================== SCÈNE 4 — LA RÉVÉLATION (15 → 20) */
        const bNat = $("#b-nat"), bAmp = $("#b-amp"), bV = $("#b-v");
        const bNatCh = split(bNat), bVch = split(bV);
        bNatCh.forEach((c) => c.classList.add("shine-t")); bVch.forEach((c) => c.classList.add("shine-t"));
        gsap.set([bNatCh, bVch, bAmp], { opacity: 0 });
        tl.fromTo("#s4-bg, #s4-fg", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out" }, 14.9);
        tl.fromTo("#s4cam-bg, #s4cam-fg", { scale: 1.38, rotation: -3 }, { scale: 0.96, rotation: 0, duration: 2.3, ease: "expo.out" }, 15.0);
        // cadre lumineux : deux traits dessinés depuis le bas, synchrones avec la tête de particules du canvas
        const FP = { p: 0 };
        tl.to(FP, { p: 1, duration: 1.9, ease: "none", onUpdate: () => { const e = E.io2(FP.p), o = 1000 * (1 - e); $("#fr-r").style.strokeDashoffset = o; $("#fr-l").style.strokeDashoffset = o; } }, 15.35);
        tl.fromTo("#frame-fill", { opacity: 0 }, { opacity: 1, duration: 0.8, ease: "power2.out" }, 17.0);
        ["#tk1", "#tk2", "#tk3", "#tk4"].forEach((t, i) => tl.fromTo(t, { opacity: 0, scale: 0, rotation: 45 }, { opacity: 1, scale: 1, rotation: 45, duration: 0.5, ease: "back.out(3)" }, 17.2 + i * 0.05));
        $$(".s4-shaft").forEach((s, i) => tl.fromTo(s, { x: -260 + i * 60, opacity: 0 }, { x: 320 - i * 80, opacity: 0.9, duration: 4.8, ease: "sine.inOut" }, 15.0));
        const s4r = $("#s4-rings");
        for (let i = 0; i < 4; i++) s4r.insertAdjacentHTML("beforeend", '<div class="ringx" style="border-width:2px;border-color:rgba(255,226,140,.38)"></div>');
        $$(".ringx", s4r).forEach((r, i) => tl.fromTo(r, { scale: 0.5, opacity: 0 }, { scale: 2.6 + i * 0.35, opacity: 0.9, duration: 3.4, ease: "power1.out", yoyo: false }, 15.2 + i * 0.5));
        $$(".ringx", s4r).forEach((r, i) => tl.to(r, { opacity: 0, duration: 1.0, ease: "power1.in" }, 17.2 + i * 0.1));
        tl.fromTo("#s4-breath", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1.4, duration: 2.0, ease: "sine.inOut" }, 15.2);
        tl.to("#s4-breath", { opacity: 0.25, duration: 1.2, ease: "power2.out" }, 17.3);
        // texte : zoom cinématique + animations fines
        tl.fromTo(bNatCh, { scale: 1.8, opacity: 0, y: 40, filter: "blur(22px)" }, { scale: 1, opacity: 1, y: 0, filter: "blur(0px)", duration: 0.9, ease: "expo.out", stagger: 0.045 }, 17.2);
        tl.fromTo(bAmp, { scale: 2.6, rotation: -35, opacity: 0, filter: "blur(18px)" }, { scale: 1, rotation: 0, opacity: 1, filter: "blur(0px)", duration: 1.0, ease: "expo.out" }, 17.38);
        tl.fromTo(bVch, { y: 160, opacity: 0, filter: "blur(16px)" }, { y: 0, opacity: 1, filter: "blur(0px)", duration: 0.8, ease: "expo.out", stagger: 0.07 }, 17.45);
        tl.fromTo([bNatCh, bVch], { backgroundPosition: "100% 0" }, { backgroundPosition: "0% 0", duration: 1.0, ease: "power2.inOut", stagger: 0.05 }, 18.0);
        tl.fromTo("#s4-stack", { scale: 0.94 }, { scale: 1.12, duration: 2.9, ease: "sine.inOut" }, 17.2);
        tl.to(bAmp, { y: -10, duration: 1.2, ease: "sine.inOut", yoyo: true, repeat: 1 }, 18.4);
        shake("#s4cam-fg, #s4cam-bg", 17.2, 12);
        // sortie : poussée traversante dorée vers la signature
        tl.to("#s4cam-bg, #s4cam-fg", { scale: 1.7, duration: 0.55, ease: "power3.in" }, 19.5);
        tl.to("#s4-bg, #s4-fg", { opacity: 0, duration: 0.3, ease: "power1.in" }, 19.85);

        /* ================================================================== SCÈNE 5 — SIGNATURE FINALE (20 → 24) */
        const tg1 = split($("#tg1")), tg2 = split($("#tg2"));
        tg1.forEach((c) => c.classList.add("gold-t"));
        gsap.set(["#logo-wrap", "#ring5"], { opacity: 0 });
        gsap.set([tg1, tg2], { opacity: 0 });
        tl.fromTo("#s5-bg, #s5-fg", { opacity: 0 }, { opacity: 1, duration: 0.45, ease: "power1.out" }, 19.85);
        tl.fromTo("#s5-rays", { opacity: 0, rotation: -14 }, { opacity: 1, rotation: 16, duration: 4.0, ease: "none" }, 20.0);
        tl.fromTo("#logo-wrap", { scale: 0.55, opacity: 0, filter: "blur(22px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 1.15, ease: "back.out(1.4)" }, 20.4);
        tl.fromTo("#ring5", { opacity: 1, scale: 0.8 }, { opacity: 1, scale: 1, duration: 1.2, ease: "expo.out" }, 20.4);
        tl.fromTo("#ring5c", { strokeDashoffset: 1000 }, { strokeDashoffset: 0, duration: 1.3, ease: "power3.out" }, 20.45);
        tl.fromTo("#glow5", { opacity: 0, scale: 0.5 }, { opacity: 0.7, scale: 1.1, duration: 0.8, ease: "expo.out" }, 20.4);
        tl.to("#glow5", { opacity: 0.22, scale: 1.0, duration: 1.0, ease: "power2.out" }, 21.2);
        tl.fromTo("#logo-wrap", { y: 0 }, { y: -10, duration: 3.0, ease: "sine.inOut" }, 21.4);
        tl.fromTo("#s5-rule", { width: 0 }, { width: 640, duration: 0.8, ease: "expo.out" }, 21.55);
        // signature : tracking cinématique
        tl.fromTo(tg1, { y: 110, opacity: 0, filter: "blur(14px)" }, { y: 0, opacity: 1, filter: "blur(0px)", duration: 0.85, ease: "expo.out", stagger: 0.03 }, 21.8);
        tl.fromTo(tg2, { y: 110, opacity: 0, filter: "blur(14px)" }, { y: 0, opacity: 1, filter: "blur(0px)", duration: 0.85, ease: "expo.out", stagger: 0.026 }, 22.0);
        tl.fromTo(tg1, { backgroundPosition: "100% 0" }, { backgroundPosition: "0% 0", duration: 1.4, ease: "power2.inOut", stagger: 0.03 }, 22.2);
        // rayonnement doré final
        tl.fromTo("#glow5", { opacity: 0.22, scale: 1.0 }, { opacity: 0.62, scale: 1.7, duration: 0.9, ease: "power2.out", immediateRender: false }, 22.5);
        tl.to("#glow5", { opacity: 0.0, scale: 2.1, duration: 0.9, ease: "power2.in" }, 23.4);
        // sortie maîtrisée : élévation douce + fondu vers le noir
        tl.to("#s5-all", { y: -34, scale: 1.04, duration: 0.8, ease: "power2.in" }, 23.2);
        tl.to("#s5-all", { opacity: 0, duration: 0.55, ease: "power2.in" }, 23.35);
        tl.to("#fadeout", { opacity: 1, duration: 0.6, ease: "power1.in" }, 23.4);

        window.__timelines["main"] = tl;
      })();
    </script>
